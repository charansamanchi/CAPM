_schema-version: 3.3.0
ID: CAPM
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: CAPM-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: CAPM-auth
  - name: CAPM
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    build-parameters:
      requires:
        - name: CAPM-user-inspect-ui
          artifacts:
            - '**'
          target-path: resources/user-inspect-ui/
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: CAPM-auth
      - name: CAPM-html5repo-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: CAPM-user-inspect-ui
    type: html5
    path: app/user-inspect-ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []

  - name: CAPM-user-attrs-ui
    type: html5
    path: app/user-attrs-ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []

  - name: CAPM-html5-deployer
    type: nodejs
    path: html5deployer
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      memory: 256M
      disk-quota: 512M
      tasks:
        - name: deploy-html5-content
          command: npm start
          memory: 256M
          disk-quota: 512M
    requires:
      - name: CAPM-html5repo
    build-parameters:
      builder: npm-ci
      build-result: .
      requires:
        - name: CAPM-user-inspect-ui
          artifacts:
            - com.capm.userinspect.zip
          target-path: resources/
        - name: CAPM-user-attrs-ui
          artifacts:
            - com.capm.userattrs.zip
          target-path: resources/

resources:
  - name: CAPM-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: CAPM-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api

  - name: CAPM-html5repo
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: CAPM-html5repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
